<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">FIA — Fraud Intelligence Agency</title>
  <desc id="d">Share the lesson. Keep the ledger. Northline Roasters and Harbor Print keep their records locked in private workspaces and exchange only approved intelligence through a shield.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4f7fdc" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#4f7fdc" stop-opacity=".10"/>
      <stop offset="1" stop-color="#4f7fdc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa3ec"/>
      <stop offset="1" stop-color="#3d6cc9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7fdc" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#4f7fdc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4f7fdc" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#284678" flood-opacity=".13"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="lock">
      <rect x="-7" y="-2" width="14" height="11" rx="2.5" fill="#0f1b33"/>
      <path d="M-4.2 -2 v-3.2 a4.2 4.2 0 0 1 8.4 0 v3.2" fill="none" stroke="#0f1b33" stroke-width="1.8"/>
    </g>
  </defs>

  <rect width="1280" height="400" fill="#fbfcfd"/>
  <path d="M0 399.5 H1280" stroke="#e6e9ef"/>

  <!-- Brand -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
    <text x="64" y="94" font-size="54" font-weight="300" fill="#0f1b33" letter-spacing="1">FIΛ</text>
    <rect x="170" y="54" width="1" height="44" fill="#c9ced8"/>
    <text x="188" y="72" font-size="11" fill="#6c7689" letter-spacing="3">FRAUD INTELLIGENCE</text>
    <text x="188" y="92" font-size="11" fill="#6c7689" letter-spacing="3">AGENCY</text>
  </g>

  <!-- Headline -->
  <g font-family="'Iowan Old Style', Palatino, 'Book Antiqua', Georgia, serif" fill="#0f1b33">
    <text x="62" y="186" font-size="50" font-weight="500" letter-spacing="-.5">Share the lesson.</text>
    <text x="62" y="244" font-size="50" font-weight="500" letter-spacing="-.5">Keep the ledger.</text>
  </g>
  <text x="64" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#6c7689">A fraud intelligence network owned by the businesses using it.</text>

  <!-- Connection beam -->
  <path d="M790 186 H1040" stroke="#4f7fdc" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
  <circle cx="830" cy="186" r="3.5" fill="#4f7fdc"/>
  <circle cx="1000" cy="186" r="3.5" fill="#4f7fdc"/>
  <circle cx="915" cy="180" r="92" fill="url(#glow)"/>

  <!-- Northline card -->
  <g filter="url(#soft)">
    <rect x="600" y="92" width="190" height="196" rx="16" fill="#ffffff" stroke="#e6ece7"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
    <circle cx="630" cy="126" r="15" fill="#e8f5ec"/>
    <path d="M623 133 C622 122 629 116 639 117 C639 127 633 133 623 133 Z" fill="#1e7a3c"/>
    <path d="M623 133 L633 123" stroke="#e8f5ec" stroke-width="1.4" stroke-linecap="round"/>
    <text x="654" y="123" font-size="13.5" font-weight="600" fill="#0f1b33">Northline</text>
    <text x="654" y="139" font-size="13.5" font-weight="600" fill="#0f1b33">Roasters</text>
    <text x="618" y="172" font-size="9" fill="#9aa3b2" letter-spacing="2">PRIVATE LEDGER</text>
    <g font-size="12" fill="#2b3650">
      <rect x="618" y="182" width="154" height="26" rx="7" fill="#f4f6f9"/>
      <text x="628" y="199">Invoices</text>
      <use xlink:href="#lock" x="756" y="195"/>
      <rect x="618" y="214" width="154" height="26" rx="7" fill="#f4f6f9"/>
      <text x="628" y="231">Supplier records</text>
      <use xlink:href="#lock" x="756" y="227"/>
      <rect x="618" y="246" width="154" height="26" rx="7" fill="#f4f6f9"/>
      <text x="628" y="263">Private memory</text>
      <use xlink:href="#lock" x="756" y="259"/>
    </g>
  </g>

  <!-- Harbor card -->
  <g filter="url(#soft)">
    <rect x="1040" y="92" width="190" height="196" rx="16" fill="#ffffff" stroke="#e5eaf3"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
    <circle cx="1070" cy="126" r="15" fill="#e8effb"/>
    <path d="M1060 124 q5 -5 10 0 t10 0" fill="none" stroke="#4f7fdc" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M1060 131 q5 -5 10 0 t10 0" fill="none" stroke="#4f7fdc" stroke-width="2.2" stroke-linecap="round" opacity=".6"/>
    <text x="1094" y="123" font-size="13.5" font-weight="600" fill="#0f1b33">Harbor</text>
    <text x="1094" y="139" font-size="13.5" font-weight="600" fill="#0f1b33">Print</text>
    <text x="1058" y="172" font-size="9" fill="#9aa3b2" letter-spacing="2">PRIVATE LEDGER</text>
    <g font-size="12" fill="#2b3650">
      <rect x="1058" y="182" width="154" height="26" rx="7" fill="#f4f6f9"/>
      <text x="1068" y="199">Invoices</text>
      <use xlink:href="#lock" x="1196" y="195"/>
      <rect x="1058" y="214" width="154" height="26" rx="7" fill="#f4f6f9"/>
      <text x="1068" y="231">Supplier records</text>
      <use xlink:href="#lock" x="1196" y="227"/>
      <rect x="1058" y="246" width="154" height="26" rx="7" fill="#f4f6f9"/>
      <text x="1068" y="263">Private memory</text>
      <use xlink:href="#lock" x="1196" y="259"/>
    </g>
  </g>

  <!-- Shield -->
  <path d="M915 134 L952 148 V178 C952 202 936 218 915 228 C894 218 878 202 878 178 V148 Z" fill="#4f7fdc" opacity=".45" filter="url(#blur)"/>
  <path d="M915 134 L952 148 V178 C952 202 936 218 915 228 C894 218 878 202 878 178 V148 Z" fill="url(#shieldFill)" stroke="#ffffff" stroke-width="2"/>
  <path d="M899 180 L911 192 L933 168" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="915" y="258" font-size="9.5" fill="#4f7fdc" letter-spacing="2.4" font-weight="600">APPROVED</text>
    <text x="915" y="273" font-size="9.5" fill="#4f7fdc" letter-spacing="2.4" font-weight="600">INTELLIGENCE ONLY</text>
  </g>

  <!-- Sponsor row -->
  <path d="M64 330 H1216" stroke="#e6e9ef"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="3" fill="#6c7689">
    <text x="64" y="364" fill="#9aa3b2">POWERED BY</text>
    <text x="1216" y="364" text-anchor="end" fill="#2b3650" xml:space="preserve">GBRAIN  ·  UFO  ·  MEMORABLE  ·  QM  ·  RIVER  ·  SUPERSET</text>
  </g>
</svg>
