<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">FIA workflow</title>
  <desc id="d">Northline learns from a fraud incident and signs a defense package. The package crosses a restricted relay. Harbor quarantines, tests and adopts it, then stops a new attack with its own records.</desc>
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#284678" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4f7fdc"/>
    </marker>
  </defs>
  <rect width="1280" height="360" fill="#fbfcfd"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
    <!-- Northline -->
    <g filter="url(#soft)"><rect x="40" y="40" width="400" height="280" rx="16" fill="#ffffff" stroke="#e6ece7"/></g>
    <circle cx="72" cy="74" r="13" fill="#e8f5ec"/>
    <path d="M66 80 C65 71 71 66 80 67 C80 76 75 80 66 80 Z" fill="#1e7a3c"/>
    <text x="94" y="70" font-size="10" letter-spacing="2.4" fill="#6c7689">1 · NORTHLINE LEARNS</text>
    <text x="94" y="88" font-size="15" font-weight="600" fill="#0f1b33">Northline Roasters</text>
    <g font-size="13" fill="#2b3650" xml:space="preserve">
      <text x="64" y="128"><tspan fill="#9aa3b2">01</tspan>  Fraud incident replayed · GBrain</text>
      <text x="64" y="154"><tspan fill="#9aa3b2">02</tspan>  Jordan investigates · UFO + GBrain</text>
      <text x="64" y="180"><tspan fill="#9aa3b2">03</tspan>  Owner confirms fraud · FIA</text>
      <text x="64" y="206"><tspan fill="#9aa3b2">04</tspan>  Lesson becomes a procedure · Memorable</text>
      <text x="64" y="232"><tspan fill="#9aa3b2">05</tspan>  Defense stress-tested · QM</text>
      <text x="64" y="258"><tspan fill="#9aa3b2">06</tspan>  Human review dossier · Superset</text>
      <text x="64" y="284"><tspan fill="#9aa3b2">07</tspan>  Owner signs the package · FIA</text>
    </g>

    <!-- Relay -->
    <path d="M444 180 H500" stroke="#4f7fdc" stroke-width="2" marker-end="url(#arrow)"/>
    <g filter="url(#soft)"><rect x="510" y="70" width="260" height="220" rx="16" fill="#f3f7fe" stroke="#d6e2f7"/></g>
    <path d="M640 92 L660 100 V116 C660 129 651 137 640 142 C629 137 620 129 620 116 V100 Z" fill="#4f7fdc"/>
    <path d="M631 117 L638 124 L650 110" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="640" y="164" text-anchor="middle" font-size="10" letter-spacing="2.4" fill="#4f7fdc" font-weight="600">RESTRICTED RELAY</text>
    <text x="640" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#0f1b33">Ed25519-signed FIA-DEF-0001</text>
    <g font-size="10" fill="#2b3650" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">
      <text x="640" y="208">manifest · procedure · synthetic-tests</text>
      <text x="640" y="226">validation-report · review-attestation</text>
      <text x="640" y="244">signature.ed25519</text>
    </g>
    <text x="640" y="272" text-anchor="middle" font-size="11" fill="#6c7689">No invoices, supplier records or credentials</text>
    <path d="M776 180 H832" stroke="#4f7fdc" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Harbor -->
    <g filter="url(#soft)"><rect x="840" y="40" width="400" height="280" rx="16" fill="#ffffff" stroke="#e5eaf3"/></g>
    <circle cx="872" cy="74" r="13" fill="#e8effb"/>
    <path d="M863 72 q4.5 -4.5 9 0 t9 0" fill="none" stroke="#4f7fdc" stroke-width="2" stroke-linecap="round"/>
    <path d="M863 78 q4.5 -4.5 9 0 t9 0" fill="none" stroke="#4f7fdc" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <text x="894" y="70" font-size="10" letter-spacing="2.4" fill="#6c7689">2 · HARBOR TESTS &amp; ADOPTS</text>
    <text x="894" y="88" font-size="15" font-weight="600" fill="#0f1b33">Harbor Print</text>
    <g font-size="13" fill="#2b3650" xml:space="preserve">
      <text x="864" y="128"><tspan fill="#9aa3b2">08</tspan>  Package quarantined · FIA</text>
      <text x="864" y="154"><tspan fill="#9aa3b2">09</tspan>  Tested on Harbor's data, activated · Memorable</text>
      <text x="864" y="180"><tspan fill="#9aa3b2">10</tspan>  New attack stopped · UFO, GBrain, River</text>
      <text x="864" y="206"><tspan fill="#9aa3b2">11</tspan>  Harbor trains its own defender · River</text>
      <text x="864" y="232"><tspan fill="#9aa3b2">12</tspan>  Works with the network cut</text>
    </g>
    <text x="864" y="284" font-size="11" fill="#6c7689">Harbor learns only through the relay package.</text>
  </g>
</svg>
